config:
  account_boot:
    clone_select_wait_s: 2
    dynamic_content: 哈哈哈
    enabled: true
    page_verify_poll_s: 1
    page_verify_retries: 12
    post_click_stable_s: 2
    allow_coord_fallback: true
    post_dynamic_enabled: true
    post_publish_wait_s: 2
    preset_address: 成都市就是低价
    step_wait_s: 1.5
  account_check:
    detect_timeout_sec: 8.0
    enabled: false
    idle_after_invite_minutes: 5
    interval_minutes: 30
    local_dir: ''
    on_abnormal: pause
    remote_dir: /sdcard/Download
  approve_greeting:
    first_batch_min_count: 3
    low_greet_wait_minutes: 5
  chat_ignore_names:
  - 收到的招呼
  - 互动通知
  - 订阅内容
  - 陌陌
  - 超级抢车位
  - 猜你喜欢
  - 谁看过我
  click_offset:
    x: 5
    y: 5
  delay:
    max: 0.8
    min: 0.3
  greet_scan_interval_s: 5
  group_name: 交友
  max_consecutive_errors: 5
  round_end_wait_s: 10
  security:
    allow_shell_exec: false
    api_token: ''
    heartbeat_timeout_sec: 30
