name: Build Windows EXE

on:
  push:
    branches: [main, "cursor/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Next.js frontend
        working-directory: webui
        run: |
          npm install
          npm run build

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install lxml pillow retry2

      - name: Download Agent APK (optional)
        shell: bash
        run: |
          mkdir -p agent-android/app/build/outputs/apk/release
          gh run download --repo ${{ github.repository }} \
            -n agent-release-apk \
            --dir agent-android/app/build/outputs/apk/release \
            2>/dev/null || echo "[warn] No APK artifact found, skipping bundle"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build with PyInstaller
        run: pyinstaller momoqun.spec

      - name: Package EXE as ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\momoqun\* -DestinationPath momoqun-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: momoqun-Windows
          path: momoqun-Windows.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: momoqun-Windows-${{ github.run_number }}
          tag_name: v0.1.${{ github.run_number }}
          files: momoqun-Windows.zip
          prerelease: false
          body: |
            ## momoqun Windows EXE

            自动构建于 ${{ github.sha }}（run #${{ github.run_number }}）。

            ### 使用方法
            1. 下载 `momoqun-Windows.zip`
            2. 解压到任意目录
            3. 运行 `momoqun.exe`
            4. 模拟器安装 Agent APK，填写 master 地址与 API Token
            5. 浏览器自动打开 `http://localhost:5100` 进入管理界面
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
